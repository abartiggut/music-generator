<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Music Generator</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<div class="wrap">
  <header class="top">
    <div id="dropzone" class="logo-wrap" tabindex="0" role="button"
         aria-label="Song hochladen und analysieren" data-i18n-aria="drop_aria"
         title="Song hierher ziehen oder klicken — Stil und Tempo werden übernommen" data-i18n-title="drop_title">
      <input id="fileInput" type="file" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg" hidden>
      <svg class="logo" viewBox="0 0 84 84" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#434445"/><stop offset="1" stop-color="#2b2c2c"/></linearGradient></defs>
      <rect x="1" y="1" width="82" height="82" rx="14" fill="url(#lg)" stroke="#2a2e38"/>
      <g fill="#ddc8aa">
        <rect x="16" y="36" width="5" height="12" rx="2.5"/><rect x="25" y="28" width="5" height="28" rx="2.5"/>
        <rect x="34" y="20" width="5" height="44" rx="2.5"/><rect x="43" y="30" width="5" height="24" rx="2.5"/>
        <rect x="52" y="24" width="5" height="36" rx="2.5"/><rect x="61" y="34" width="5" height="16" rx="2.5"/>
      </g>
      </svg>
      <div id="dzBubble" class="dz-bubble" role="status" aria-live="polite"></div>
    </div>
    <a class="brand-link" href="https://alphatester.rabbitfire.de/" target="_blank" rel="noopener" title="Zur Alphatester-Webseite" data-i18n-title="brand_title">
      <img class="brand" src="/static/alphatester.png" alt="Alphatester">
    </a>
    <div class="divider"></div>
    <h1 class="title"><span>MUSIC</span><span>GENERATOR</span></h1>
    <div class="top-right">
      <div class="langsw" role="group" aria-label="Language / Sprache"><button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button></div>
      <div id="status" class="box small" title="Modellserver">…</div>
      <button id="btnSettings" class="gear" title="Setup" aria-label="Setup">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <section class="card">
    <form id="genForm">
      <div class="field"><div class="lblrow"><span class="lbl" title="Nur zum Wiederfinden, hat keinen Einfluss auf die Musik." data-i18n-title="title_tip" data-i18n="title">Titel</span>
        <button type="button" id="titleDice" class="dice" title="Zufälligen Titel würfeln" aria-label="Zufälligen Titel würfeln" data-i18n-title="title_dice" data-i18n-aria="title_dice"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg></button></div>
        <input name="title" placeholder="optional" data-i18n-ph="title_ph">
      </div>

      <div class="field"><div class="lblrow"><span class="lbl" title="Deine Idee für den Song: Stimmung, Szene, Klang. Wird zusammen mit dem Stil ans Modell geschickt." data-i18n-title="prompt_tip" data-i18n="prompt">Prompt</span>
        <button type="button" id="diceBtn" class="dice" title="Zufälligen Prompt würfeln" aria-label="Zufälligen Prompt würfeln" data-i18n-title="prompt_dice" data-i18n-aria="prompt_dice">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>
        </button></div>
        <textarea name="prompt" rows="2" placeholder="nächtliche Autofahrt durch eine Neonstadt, langsam und hypnotisch" data-i18n-ph="prompt_ph"></textarea>
      </div>

      <div class="field"><div class="lblrow"><span class="lbl" title="Stilrichtung: Genre, Instrumente, Sound. Der Würfel mischt einen Stil, unter „Stile“ liegen Karten zum Anklicken." data-i18n-title="style_tip" data-i18n="style">Stil</span>
        <button type="button" id="styleDice" class="dice" title="Zufälligen Stil würfeln" aria-label="Zufälligen Stil würfeln" data-i18n-title="style_dice" data-i18n-aria="style_dice"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg></button></div>
        <textarea name="style" rows="2" placeholder="trip hop, dark, dub bass"></textarea>
      </div>
      <details id="styleBox">
        <summary data-i18n="styles">Stile</summary>
        <div class="chips" id="tagChips"></div>
      </details>

      <!-- Feste Vorgaben, nicht mehr sichtbar: Instrumental (wird im Lyrics-Bereich gesteuert) und Prompt wörtlich -->
      <input type="checkbox" name="instrumental" checked hidden>
      <input type="checkbox" name="keep_caption" checked hidden>

      <div class="field"><span class="lbl" data-i18n="length">Länge</span>
        <div class="slider" data-fmt="dur">
          <div class="fill"></div><div class="knob"><span></span></div>
          <input name="duration" type="range" min="10" max="300" step="5" value="90" aria-label="Länge" title="0:10 bis 5:00" data-i18n-aria="length" data-i18n-title="length_tip">
        </div>
      </div>

      <div class="field"><span class="lbl" title="Ganz links = Auto: Das Modell wählt das Tempo." data-i18n-title="bpm_tip">BPM</span>
        <div class="slider" data-fmt="bpm">
          <div class="fill"></div><div class="knob"><span></span></div>
          <input name="bpm" type="range" min="50" max="200" step="1" value="50" aria-label="BPM">
        </div>
      </div>

      <details id="lyricsBox" title="Leer lassen: Das Modell schreibt eigene Lyrics. Die Sprache wählst du darunter (Standard: Englisch)." data-i18n-title="lyrics_tip">
        <summary><span><span data-i18n="lyrics">Lyrics</span> <span id="lyricsHint" class="sumhint"></span></span>
          <span class="dice-wrap"><button type="button" id="lyricsDice" class="dice" title="Lyrics automatisch schreiben lassen (erst beim Generieren)" aria-label="Lyrics automatisch schreiben lassen" data-i18n-title="lyrics_dice" data-i18n-aria="lyrics_dice"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg></button></span>
        </summary>
        <div class="field lang"><span class="lbl" data-i18n="language">Sprache</span>
          <select name="vocal_language" aria-label="Sprache der Lyrics" data-i18n-aria="language_aria">
            <option value="en" selected data-i18n="en">Englisch</option><option value="de" data-i18n="de">Deutsch</option><option value="fr" data-i18n="fr">Französisch</option>
            <option value="es" data-i18n="es">Spanisch</option><option value="it" data-i18n="it">Italienisch</option><option value="pt" data-i18n="pt">Portugiesisch</option>
            <option value="ja" data-i18n="ja">Japanisch</option><option value="ko" data-i18n="ko">Koreanisch</option><option value="zh" data-i18n="zh">Chinesisch</option><option value="ru" data-i18n="ru">Russisch</option>
          </select></div>
        <textarea name="lyrics" rows="7" placeholder="[verse]&#10;…&#10;&#10;[chorus]&#10;…"></textarea>
        <div class="chips" id="sectionChips"></div>
      </details>

      <details id="advBox">
        <summary data-i18n="advanced">Erweitert</summary>
        <div class="field adv"><span class="lbl" title="Diffusionsschritte der Klangerzeugung. Mehr = langsamer, ab etwa 50 kaum noch hörbar besser (Modell-Vorgabe: 50)." data-i18n-title="iterations_tip" data-i18n="iterations">Iterationen</span>
          <div class="slider" data-fmt="int">
            <div class="fill"></div><div class="knob"><span></span></div>
            <input name="inference_steps" type="range" min="10" max="100" step="5" value="50" aria-label="Iterationen" data-i18n-aria="iterations">
          </div>
        </div>
        <div class="field adv"><span class="lbl" title="Wie mutig das Sprachmodell den Song plant. Niedriger = vorhersehbar, höher = abwechslungsreicher, zu hoch = zerfahren (Modell-Vorgabe: 0.85)." data-i18n-title="variance_tip" data-i18n="variance">Varianz</span>
          <div class="slider" data-fmt="temp">
            <div class="fill"></div><div class="knob"><span></span></div>
            <input name="lm_temperature" type="range" min="0.3" max="1.5" step="0.05" value="1" aria-label="Varianz" data-i18n-aria="variance">
          </div>
        </div>
        <div class="grid">
          <label class="field"><span class="lbl" data-i18n="key">Tonart</span>
            <select name="keyscale">
            <option value="">Auto</option>
            <option value="C major">C major</option>
            <option value="G major">G major</option>
            <option value="D major">D major</option>
            <option value="A major">A major</option>
            <option value="E major">E major</option>
            <option value="F major">F major</option>
            <option value="A minor">A minor</option>
            <option value="E minor">E minor</option>
            <option value="D minor">D minor</option>
            <option value="C minor">C minor</option>
            </select>
          </label>
          <label class="field"><span class="lbl" data-i18n="timesig">Takt</span>
            <select name="timesignature">
            <option value="">Auto</option>
            <option value="4" data-i18n="ts_default">4/4 (Standard)</option>
            <option value="3" data-i18n="ts_waltz">3/4 (Walzer)</option>
            <option value="6">6/8</option>
            <option value="2" data-i18n="ts_march">2/4 (Marsch)</option>
            </select>
          </label>
          <label class="field"><span class="lbl" title="Gleicher Seed + gleiche Einstellungen = gleicher Song" data-i18n-title="seed_tip">Seed</span><input name="seed" type="number" placeholder="zufällig" data-i18n-ph="seed_ph"></label>
        </div>
      </details>

      <div class="genbar">
        <div class="field" style="margin-bottom:0"><span class="lbl" title="Anzahl Versionen desselben Prompts, jede mit eigenem Seed. In der Bibliothek heißen sie A, B, C …" data-i18n-title="versions_tip" data-i18n="versions">Versionen</span>
          <div class="genrow">
            <div class="slider" data-fmt="int">
              <div class="fill"></div><div class="knob"><span></span></div>
              <input name="variants" type="range" min="1" max="10" step="1" value="2" aria-label="Versionen" data-i18n-aria="versions">
            </div>
            <button type="submit" id="genBtn" class="aktion big">2× GENERIEREN</button>
          </div>
        </div>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="libhead">
      <div class="libtitle"><h2 class="col-title" data-i18n="library">Bibliothek</h2><span id="libStats" class="sumhint"></span></div>
      <input id="search" type="search" placeholder="Suchen" data-i18n-ph="search">
      <button type="button" id="onlyFav" class="sek icon" aria-pressed="false" title="Nur Favoriten zeigen" aria-label="Nur Favoriten zeigen" data-i18n-title="only_fav" data-i18n-aria="only_fav">☆</button>
    </div>
    <div id="folderBar" class="folderbar"></div>
    <div id="library"></div>
  </section>
</div>

<footer id="player" hidden>
  <div class="player-in">
    <button id="playBtn" class="aktion round" aria-label="Abspielen" data-i18n-aria="play">▶</button>
    <div class="pmeta">
      <div id="pTitle"></div>
      <div id="waveform"></div>
    </div>
    <span id="pTime" class="time"></span>
    <div class="vol" id="vol">
      <button type="button" id="volBtn" class="sek icon" title="Stumm" aria-label="Stumm" data-i18n-title="mute" data-i18n-aria="mute">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w1" d="M16 9a3.5 3.5 0 0 1 0 6"/><path class="w2" d="M18.5 6.5a7 7 0 0 1 0 11"/><path class="mx" d="M17 9l5 6M22 9l-5 6"/>
        </svg>
      </button>
      <input id="volRange" type="range" min="0" max="100" step="1" value="100" aria-label="Lautstärke" data-i18n-aria="volume">
    </div>
  </div>
</footer>

<dialog id="settingsDlg">
  <form method="dialog" id="settingsForm">
    <h2 class="col-title">Setup</h2>
    <div class="field"><span class="lbl" data-i18n="connection">Verbindung</span>
      <span id="runtimeInfo" class="small" role="status"></span>
      <span id="connectionHint" class="small" data-i18n="connection_locked" hidden>Zum Wechseln die App stoppen und Install erneut mit dem gewünschten Modus ausführen.</span>
    </div>
    <label class="field"><span class="lbl">Backend</span>
      <select name="engine">
        <option value="acestep_cpp">ACE-Step 1.5 (acestep.cpp)</option>
        <option value="mock" data-i18n="mock">Mock (Testton)</option>
      </select>
    </label>
    <label class="field"><span class="lbl" title="Lokale oder entfernte Musik-Engine" data-i18n-title="synth_tip" data-i18n="synth_srv">Synthese-Server</span>
      <input name="server_url" placeholder="http://127.0.0.1:18085">
    </label>
    <label class="field"><span class="lbl" title="Leer = gleicher Server wie Synthese." data-i18n-title="lm_tip" data-i18n="lm_srv">Sprachmodell-Server</span>
      <input name="lm_url" placeholder="Leer = gleicher Server" data-i18n-ph="lm_ph">
    </label>
    <label class="field"><span class="lbl" data-i18n="timeout">Timeout (Min.)</span>
      <input name="timeout_minutes" type="number" min="1" max="240">
    </label>
    <div class="field"><span class="lbl" data-i18n="layout">Anordnung</span>
      <div class="seg" role="group" aria-label="Anordnung" data-i18n-aria="layout">
        <button type="button" class="sek" data-layout="stack" aria-pressed="true" data-i18n="stacked">Untereinander</button>
        <button type="button" class="sek" data-layout="side" aria-pressed="false" title="Generator links, Bibliothek rechts (ab ca. 1000 px Breite)" data-i18n-title="side_tip" data-i18n="side">Nebeneinander</button>
      </div></div>
    <div class="field"><span class="lbl" data-i18n="version">Version</span>
      <div class="upd-row"><button type="button" id="updCheck" class="sek" data-i18n="upd_check">Nach Updates suchen</button><span id="updInfo" class="small"></span></div>
      <ul id="updList" class="upd-list" hidden></ul>
      <button type="button" id="updApply" class="aktion" hidden data-i18n="upd_apply">JETZT AKTUALISIEREN</button>
    </div>
    <div class="field"><span class="lbl" data-i18n="servers">Server</span>
      <div class="upd-row"><button type="button" id="stopBtn" class="sek danger" data-i18n="stop">Server stoppen</button><span id="stopInfo" class="small"></span></div>
    </div>
    <div class="field"><span class="lbl">GitHub</span>
      <div class="upd-row"><a href="https://github.com/abartiggut/music-generator" target="_blank" rel="noopener" class="sek" data-i18n="github">GitHub</a><span class="small" data-i18n="github_info">Quellcode und Anleitung</span></div>
    </div>
    <p id="settingsError" class="small err-t" role="alert" hidden></p>
    <div class="submit">
      <button value="cancel" class="sek" data-i18n="cancel">Abbrechen</button>
      <button value="save" id="saveBtn" class="aktion" data-i18n="save">SPEICHERN</button>
    </div>
  </form>
</dialog>

<script src="/static/vendor/wavesurfer.min.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
